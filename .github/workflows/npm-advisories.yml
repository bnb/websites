name: npm advisories

# Known vulnerabilities in the npm packages the sites run. Pull requests and pushes that change the
# lockfile or the allowlist, and weekly for advisories published between them. Only production
# dependencies: the dev tooling's advisories don't reach anyone visiting the sites, and Dependabot
# updates them monthly. audit-ci runs `npm audit` and skips the advisories allowlisted in
# .github/audit-ci.jsonc, which says why each one is there and when to remove it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # Scheduled and manual runs skip the filter, which leaves its output empty: they always audit.
    # The API lists at most 3000 of a pull request's files, so one that size runs everything.
    outputs:
      run: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.run || 'true' }}
    steps:
      # A pull request's files come from the API. A push is diffed against the last commit this
      # workflow passed on, so what a cancelled or failed run didn't check runs on the next push.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        id: base
        uses: ./.github/actions/last-passed
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            run:
              - 'package-lock.json'
              - '.github/audit-ci.jsonc'
              - '.github/workflows/npm-advisories.yml'

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Reads package-lock.json alone: only audit-ci itself is installed.
      - run: npx --yes audit-ci@7.1.0 --config .github/audit-ci.jsonc

  # The check to require on main: it fails if any job above failed or was cancelled, and passes
  # when they all passed or were skipped because nothing they check changed.
  passed:
    name: npm advisories passed
    if: always()
    needs: [changes, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Weekly runs only: a failed audit opens an issue, or comments on the open one, and the next run
  # that passes closes it (scheduled-issue.yml).
  report:
    needs: [audit]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      details: The audit job's log lists each advisory and the package it's in.
