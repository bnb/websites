name: Scheduled

# Weekly and on demand (Actions > Scheduled > Run workflow, on any branch):
# - every site's end-to-end tests in each Playwright project (packages/testing/src/playwright.ts):
#   Chromium, Firefox and WebKit, where pull requests only run Chromium
# - Lighthouse on every site, since tierney.camera and tierneycyren.com render live AT Protocol
#   records that change without a commit here
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A second run on the same branch (say, dispatched during the weekly one) replaces the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (${{ matrix.app }}, every browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [bnb.im, tierney.camera, tierneycyren.com]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - if: matrix.app == 'bnb.im'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/bnb.im/.cache
          key: bnb-im-cache-${{ github.run_id }}-${{ github.job }}
          restore-keys: bnb-im-cache-
      - run: npm run test:e2e -w "apps/$APP"
        env:
          APP: ${{ matrix.app }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/

  lighthouse:
    name: Lighthouse (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [bnb.im, tierney.camera, tierneycyren.com]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # See ci.yml's lighthouse job.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/lighthouse-report/

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it (scheduled-issue.yml).
  report:
    needs: [e2e, lighthouse]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      details: >-
        Each failed site's Playwright report, with every failed test's trace and screenshots, is
        the run's playwright-report-* artifact, and its Lighthouse reports are the
        lighthouse-report-* artifacts.
