<!doctype html>
<html lang="en" data-theme="camera">
	<head>
		<meta charset="utf-8" />
		<!-- mark that JS is available, so the reveal animations only apply with JS
		     (no-JS / crawlers get fully-visible content). If the app hasn't started
		     within a few seconds (a blocked or failed bundle), drop the mark again so
		     the photographs are never left hidden. The CSP allows it by hash (svelte.config.js). -->
		<script>
			document.documentElement.classList.add('js');
			setTimeout(() => {
				const root = document.documentElement;
				if (!root.classList.contains('hydrated')) root.classList.remove('js');
			}, 4000);
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- warm up the image CDN connection for faster LCP (non-CORS <img> fetches) -->
		<link rel="preconnect" href="https://cdn.bsky.app" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0b0b" />
		<meta name="color-scheme" content="dark" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
